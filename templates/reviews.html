<section class="guest-reviews"><div class="wrap"><div class="section-head"><p class="eyebrow">WORDS FROM OUR COMMUNITY</p><h2>Experiences, in their words.</h2></div><div class="review-grid">{% for r in reviews %}<figure class="guest-note"><blockquote>{{ r.quote }}</blockquote><figcaption><strong>{{ r.name }}</strong>{% for p in properties if p.id==r.property_id %}<span>{{ p.name }}</span>{% endfor %}{% if r.stay_month %}<span>{{ r.stay_month }}</span>{% endif %}{% if r.source_url %}<a href="{{ r.source_url }}" target="_blank" rel="noopener noreferrer">{{ r.source or 'Review source' }} ↗</a>{% elif r.source %}<span>{{ r.source }}</span>{% endif %}</figcaption></figure>{% endfor %}</div></div></section>
